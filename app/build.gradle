plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sinisk3r.visualizer'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.sinisk3r.visualizer'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
        ndk {
            // The TCL G08 runs a 32-bit userspace. arm64 is here so the same APK runs on newer TVs.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB for now: signed with the debug key. Use a real key before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
