plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sinisk3r.visualizer'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.sinisk3r.visualizer'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
        ndk {
            // The TCL G08 runs a 32-bit userspace. arm64 is here so the same APK runs on newer TVs.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Play uploads: `./gradlew bundleRelease -PplayUpload` signs with the upload key (one key for all the user's apps;
    // Play App Signing holds the real app key). Its path and passwords come from ~/.gradle/gradle.properties, never
    // from this repo: UPLOAD_KEYSTORE, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD.
    // Without -PplayUpload, release builds keep the debug key, so `adb install -r` still updates the TV in place.
    signingConfigs {
        upload {
            if (project.hasProperty('UPLOAD_KEYSTORE')) {
                storeFile file(UPLOAD_KEYSTORE)
                storePassword UPLOAD_KEYSTORE_PASSWORD
                keyAlias UPLOAD_KEY_ALIAS
                keyPassword UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('playUpload')) {
                if (!project.hasProperty('UPLOAD_KEYSTORE')) {
                    throw new GradleException("-PplayUpload needs UPLOAD_KEYSTORE etc. in ~/.gradle/gradle.properties")
                }
                signingConfig signingConfigs.upload
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
